[package]
name = "lolhelper"
version = "0.0.0"
description = "LoL Helper — League of Legends assistant: counter-picks, builds, match history and an in-game widget"
authors = ["Rafał Polak (Banzamel)"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[lib]
name = "lolhelper_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "charset"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
windows-version = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
