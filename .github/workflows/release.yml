name: Build & release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-data
      - run: npm test
      - run: npm run typecheck
      - run: npx vite build

      # Releases: version check, signed installer, update manifests, GitHub Release.
      - run: node scripts/version.cjs check
        if: startsWith(github.ref, 'refs/tags/v')
      - run: node scripts/version.cjs notes release-notes.md
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: dtolnay/rust-toolchain@stable
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: Swatinem/rust-cache@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          workspaces: src-tauri
      - name: Build the signed installer
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - run: npm run release:manifests -- src-tauri/target/release/bundle/nsis
        if: startsWith(github.ref, 'refs/tags/v')
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            release/LoLHelper-Setup-*.exe
            release/latest.json
            release/latest.yml
          body_path: release-notes.md
