<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' app: https://ddragon.leagueoflegends.com data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>LoL Helper</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <header class="titlebar">
    <div class="brand"><span class="brand-hex"></span><span data-i18n="app.name"></span></div>
    <div class="titlebar-status">
      <span class="status-pill" id="lcu-status"><i></i><span></span></span>
      <span class="phase-pill" id="game-phase"></span>
      <span class="patch-pill" id="patch"></span>
    </div>
    <div class="window-controls">
      <button data-win="minimize" data-i18n-title="window.minimize">&#x2013;</button>
      <button data-win="maximize" data-i18n-title="window.maximize">&#x25A1;</button>
      <button data-win="close" class="close" data-i18n-title="window.close">&#x2715;</button>
    </div>
  </header>
  <div class="shell">
    <nav class="sidebar" id="nav"></nav>
    <main id="view" class="view"></main>
  </div>
  <div id="modal-root"></div>
  <div id="tooltip" class="tooltip" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
